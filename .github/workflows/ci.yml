name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI builds against fixtures. No real endpoint, and no secret, is ever
  # required to build or test this frontend.
  NEXT_PUBLIC_BRIDGE_API_MODE: mock
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_OFFICIAL_DOMAINS: localhost

jobs:
  secret-guard:
    name: Secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Runs first and without installing dependencies: if a secret has entered
      # the repository, the build must fail before anything else executes.
      - run: node scripts/check-no-secrets.mjs

  quality:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    needs: secret-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Coverage thresholds are enforced here, not merely reported.
      - run: npm run test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: secret-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end (desktop and 360px)
    runs-on: ubuntu-latest
    needs: secret-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A high-severity advisory in a bridge frontend is a release blocker.
      # The gate script enforces exactly that policy via `npm audit --json`,
      # with a narrowly-scoped exception for two specific GHSA ids
      # (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq — image-size, a
      # build-time-only transitive of the wallet-adapter chain with no fixed
      # release). Full justification and the removal condition live beside
      # the allowlist in scripts/audit-gate.mjs. Every other high/critical
      # advisory still fails this job, and malformed audit output fails
      # closed.
      - run: node scripts/audit-gate.mjs
